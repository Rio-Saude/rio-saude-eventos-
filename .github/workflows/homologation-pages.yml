name: Homologação - frontend estático

on:
  push:
    branches: [feat/onboarding-experimental-crm]
    paths:
      - 'homologacao-publica/**'
      - 'onboarding.js'
      - 'parq.js'
      - 'portal.css'
      - 'commercial-admin.js'
      - 'minha-assinatura.js'
      - 'tests/**'
      - 'scripts/build-homologation-public.mjs'
      - '.github/workflows/homologation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rio-saude-homologacao-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validar frontend de homologação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes de contrato
        run: node --test tests/financial-homologation-contract.test.mjs tests/commercial-crm-contract.test.mjs
      - name: Gerar pacote estático permitido
        run: node scripts/build-homologation-public.mjs
      - name: Guardar pacote validado
        uses: actions/upload-artifact@v4
        with:
          name: rio-saude-homologacao-publica
          path: homologacao-publica/dist
          if-no-files-found: error

  configuration:
    name: Verificar configuração de publicação
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$PROJECT" ] && [ -n "$API_TOKEN" ] && [ -n "$ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Pages ainda não foi configurado; nenhum deploy será feito."
          fi

  deploy:
    name: Publicar no Cloudflare Pages
    needs: [validate, configuration]
    # Enquanto a conta Cloudflare não estiver vinculada, o deploy fica bloqueado;
    # a validação continua executando e nenhum arquivo é publicado.
    if: ${{ needs.configuration.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rio-saude-homologacao-publica
          path: dist
      - name: Publicar somente o pacote estático validado
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: dist
          branch: homologacao
